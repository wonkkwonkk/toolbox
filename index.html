<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WON's Toolbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--wall:#e4e2dc;--hole:#b3afa5;--paper:#f7f6f2;--ink:#1a1a1a;--sub:#4a4842;--mute:#5c5950;--line:#8f8b81;--ac:#ff4f00;--ac2:#e04400}
*{box-sizing:border-box}
body{margin:0;word-break:keep-all;color:var(--ink);font-family:'Noto Sans KR',sans-serif;
  background-color:var(--wall);background-image:radial-gradient(circle,var(--hole) 3px,transparent 3.6px);background-size:36px 36px;background-position:18px 18px;min-height:100vh}
.mono{font-family:'JetBrains Mono',monospace}
.wrap{max-width:1180px;margin:0 auto;padding:32px 16px 64px;display:flex;flex-direction:column;gap:44px}
@media(min-width:600px){.wrap{padding:32px 32px 64px}}
.bar{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;background:var(--ink);color:#f2f1ec;padding:12px 18px;border-radius:6px;font-size:13px}
.bar h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.06em}
.bar span{color:#c9c6bd}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:44px 28px}
.slot{display:flex;flex-direction:column;align-items:center}
.pin{width:14px;height:14px;border-radius:50%;background:var(--ink);margin-bottom:-7px;position:relative;z-index:2}
.tool{transform-origin:50% 0;border:0;padding:0;background:transparent;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;display:flex;flex-direction:column;align-items:center}
.tool:hover,.tool:focus-visible{animation:swing 1.1s ease-in-out infinite;outline:none}
.tool:focus-visible .card{box-shadow:0 0 0 3px var(--ac)}
@keyframes swing{0%,100%{transform:rotate(2.2deg)}50%{transform:rotate(-2.2deg)}}
.card{width:100%;background:var(--paper);border:1.5px solid var(--ink);border-radius:10px;padding:22px 14px 14px;display:flex;flex-direction:column;gap:10px;position:relative;transition:box-shadow .2s}
.tool:hover .card{box-shadow:0 22px 30px -18px rgba(0,0,0,.45)}
.card::before{content:"";position:absolute;left:50%;top:8px;transform:translateX(-50%);width:26px;height:8px;border-radius:4px;border:1.5px solid var(--ink);background:var(--wall)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding-top:6px}
.meta b{font-weight:700}
.tag{background:var(--ac);color:var(--ink);padding:2px 8px;border-radius:3px;font-weight:700;white-space:nowrap}
.shot{width:100%;aspect-ratio:10/7;object-fit:cover;border-radius:6px;border:1px solid var(--ink);display:block;background:var(--wall)}
.noshot{display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--mute)}
.name{font-weight:800;font-size:18px;line-height:1.3}
.empty .pin{background:var(--line)}
.empty .hole{width:100%;min-height:270px;border:2px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(247,246,242,.45);color:var(--mute)}
.empty .hole b{font-size:13px}
/* 꺼낸 도구 패널 */
.back{position:fixed;inset:0;background:rgba(26,26,26,.4);display:flex;justify-content:flex-end;z-index:20}
.back[hidden]{display:none}
.panel{width:min(540px,100%);height:100%;background:var(--paper);border-left:1.5px solid var(--ink);padding:28px 20px;display:flex;flex-direction:column;gap:18px;overflow:auto;animation:slidein .35s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;font-weight:700}
.x{min-height:44px;padding:0 16px;border-radius:99px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.x:hover{background:var(--ink);color:#fff}
.panel h2{margin:0;font-weight:800;font-size:32px;letter-spacing:-.02em;line-height:1.2}
.panel p{margin:0;font-size:17px;line-height:1.7;color:var(--sub)}
.go{align-self:flex-start;display:inline-flex;align-items:center;min-height:52px;padding:0 28px;border-radius:99px;background:var(--ac);color:var(--ink);font-weight:800;font-size:17px;text-decoration:none;white-space:nowrap;transition:background .2s}
.go:hover{background:var(--ac2)}
@media (prefers-reduced-motion:reduce){.tool:hover,.tool:focus-visible,.panel{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar mono"><h1>WON's Toolbox</h1><span id="count"></span></header>
  <main class="wall" id="wall"></main>
</div>

<div class="back" id="back" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="pname">
    <div class="ptop mono"><span id="pno"></span><button class="x" id="close">벽에 다시 걸기 ×</button></div>
    <img class="shot" id="pimg" alt="">
    <h2 id="pname"></h2>
    <p id="pdesc"></p>
    <a class="go" id="pgo">이 도구 쓰기 →</a>
  </div>
</div>

<script>
// 앱 목록은 apps.json 에서 고칩니다 (추가·수정·삭제·순서).
const EMPTY = 3; // 벽 끝에 그려 둘 빈 자리 수
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const no = i => "T-" + String(i + 1).padStart(2, "0");
let apps = [], lastBtn = null;

fetch("apps.json", { cache: "no-store" }).then(r => r.json()).then(list => {
  apps = list;
  $("count").textContent = "도구 " + apps.length;
  $("wall").innerHTML = apps.map((a, i) => `
    <div class="slot"><button class="tool" data-i="${i}" aria-label="${esc(a.name)} 꺼내기">
      <div class="pin" aria-hidden="true"></div>
      <div class="card">
        <div class="meta mono"><b>${no(i)}</b>${a.tag ? `<span class="tag">${esc(a.tag)}</span>` : ""}</div>
        ${a.img ? `<img class="shot" src="${esc(a.img)}" alt="" loading="lazy">` : `<div class="shot noshot mono">NO IMAGE</div>`}
        <div class="name">${esc(a.name)}</div>
      </div>
    </button></div>`).join("")
  + Array.from({ length: EMPTY }, (_, k) => `
    <div class="slot empty" aria-hidden="true"><div class="pin"></div>
      <div class="hole mono"><b>${no(apps.length + k)}</b><span style="font-family:'Noto Sans KR',sans-serif;font-size:15px">빈 자리 · 곧 걸립니다</span></div></div>`).join("");
}).catch(() => { $("wall").textContent = "도구 목록을 불러오지 못했어요. 새로고침해 주세요."; });

$("wall").addEventListener("click", e => {
  const b = e.target.closest(".tool"); if (!b) return;
  const i = +b.dataset.i, a = apps[i];
  lastBtn = b;
  $("pno").textContent = no(i) + (a.tag ? " · " + a.tag : "");
  $("pimg").hidden = !a.img; if (a.img) { $("pimg").src = a.img; $("pimg").alt = a.name + " 화면"; }
  $("pname").textContent = a.name;
  $("pdesc").textContent = a.desc || "";
  $("pgo").href = a.url;
  $("back").hidden = false;
  $("close").focus();
});
const close = () => { $("back").hidden = true; lastBtn?.focus(); };
$("close").onclick = close;
$("back").addEventListener("click", e => { if (e.target === $("back")) close(); });
addEventListener("keydown", e => { if (e.key === "Escape" && !$("back").hidden) close(); });
</script>
</body>
</html>
